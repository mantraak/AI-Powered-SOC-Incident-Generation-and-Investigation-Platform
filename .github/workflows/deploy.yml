name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate Compose configuration
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

  deploy:
    name: Deploy over SSH
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_PORT: ${{ secrets.SERVER_PORT }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *".."* ]]
          case "$DEPLOY_PATH" in
            /|/home|/root|/usr|/var|/opt) echo "DEPLOY_PATH is too broad" >&2; exit 1 ;;
          esac
          SSH_PORT="${SSH_PORT:-22}"
          echo "SSH_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p -- '$DEPLOY_PATH'"

      - name: Synchronize application files
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='infrastructure/.env.tools' \
            --exclude='infrastructure/wazuh/certs/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Rebuild and restart application
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          command -v docker >/dev/null
          docker compose version >/dev/null
          test -f infrastructure/docker-compose.yml

          if [ ! -f .env ]; then
            command -v openssl >/dev/null
            umask 077
            secret_key="$(openssl rand -hex 48)"
            printf 'SECRET_KEY=%s\nROMULUS_PORT=48173\n' "$secret_key" > .env
            echo "Created $DEPLOY_PATH/.env; add optional production settings there."
          fi

          docker network inspect ai-soc-tools >/dev/null 2>&1 || \
            docker network create ai-soc-tools >/dev/null

          docker compose --env-file .env -f infrastructure/docker-compose.yml \
            up -d --build --remove-orphans

          docker compose --env-file .env -f infrastructure/docker-compose.yml \
            exec -T backend \
            python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)"
          REMOTE

